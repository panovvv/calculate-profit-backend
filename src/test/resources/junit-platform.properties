# Run test METHODS in parallel (safe: each test creates its own data under a unique shipment
# reference and queries only by that reference — no shared/seed state, no cleanup).
#
# Test CLASSES run sequentially (same_thread) so the two @SpringBootTest contexts never start at
# the same time; they then safely share a single in-memory database without racing on Flyway.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=dynamic
